<script>
  /* 白屏兜底：资源未加载 / 脚本报错时给出明确提示，而不是一片空白 */
  (function () {
    function panic(msg, detail) {
      var pr = document.getElementById('pageRoot');
      if (!pr) return;
      pr.innerHTML =
        '<div style="height:100%;display:flex;align-items:center;justify-content:center;padding:40px">' +
          '<div style="max-width:720px;text-align:center;line-height:1.9">' +
            '<div style="font-size:18px;color:#FF6B7A;font-weight:700;margin-bottom:10px">页面未能加载</div>' +
            '<div style="font-size:13px;color:#8FA8C4">' + msg + '</div>' +
            (detail ? '<div style="margin-top:12px;font-size:11px;color:#5E7A9B;word-break:break-all;font-family:monospace">' + detail + '</div>' : '') +
            '<div style="margin-top:18px;font-size:12px;color:#7FA8D9">' +
              '建议：使用 Chrome / Edge 直接双击打开本文件；若通过局域网或第三方工具预览，请确认 js/ 与 data/ 目录与本文件在同一层。' +
            '</div>' +
          '</div>' +
        '</div>';
    }
    window.addEventListener('error', function (e) {
      if (e && e.target && e.target.tagName === 'SCRIPT') {
        panic('脚本文件加载失败：' + (e.target.src || '').split('/').pop());
      }
    }, true);
    setTimeout(function () {
      var pr = document.getElementById('pageRoot');
      if (pr && pr.children.length === 0) {
        panic(window.DCIM ? '页面脚本执行异常，请查看浏览器控制台。' : '动环数据仍在加载。请确认已登录，且后端 /bjga/bootstrap 可访问。');
      }
    }, 2500);
  })();

  App.start(function () {
    App.boot();
    document.getElementById('btnAlarm').addEventListener('click', function () { App.go('facility'); });
    document.getElementById('btnHome').addEventListener('click', function () { App.go('dashboard'); });
    document.getElementById('btnAdmin').addEventListener('click', function () { App.leaveTo('/#/Project'); });
    document.getElementById('btnMsg').addEventListener('click', function () { App.toast('暂无新消息'); });
    document.getElementById('btnFs').addEventListener('click', function () { App.fullscreen(); });
  });
</script>
